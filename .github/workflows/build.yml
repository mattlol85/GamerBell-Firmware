name: Build Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Get version from tag or commit
      id: version
      run: |
        # Try to get version from git tag
        if git describe --tags --exact-match 2>/dev/null; then
          VERSION=$(git describe --tags --exact-match)
        else
          # Use branch and short commit hash
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Prepare config for build
      run: |
        # Use example config if config.h doesn't exist (for CI builds)
        if [ ! -f src/config.h ]; then
          echo "Using example config for CI build"
          cp src/config.h.example src/config.h
        fi
    
    - name: Build firmware
      run: |
        platformio run
      env:
        PLATFORMIO_BUILD_FLAGS: -D GIT_COMMIT=\"${{ steps.version.outputs.GIT_COMMIT }}\" -D CONFIG_H
    
    - name: Rename firmware binary
      run: |
        mkdir -p dist
        cp .pio/build/esp32dev/firmware.bin dist/gamerbell-firmware-${{ steps.version.outputs.VERSION }}.bin
        # Also create a copy with just "latest" for easy reference
        cp .pio/build/esp32dev/firmware.bin dist/gamerbell-firmware-latest.bin
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ steps.version.outputs.VERSION }}
        path: |
          dist/*.bin
        retention-days: 30
    
    - name: Display firmware info
      run: |
        ls -lh dist/
        echo "Firmware built successfully!"
        echo "Version: ${{ steps.version.outputs.VERSION }}"
        echo "Commit: ${{ steps.version.outputs.GIT_COMMIT }}"
