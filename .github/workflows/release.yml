name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Extract version from tag
      id: version
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "TAG=$TAG" >> $GITHUB_OUTPUT
        
        # Extract semantic version numbers (remove 'v' prefix)
        VERSION=${TAG#v}
        IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
        
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        
        echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
        echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
        echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
        echo "Building release version: $VERSION"
    
    - name: Prepare config for build
      run: |
        # Use example config if config.h doesn't exist (for CI builds)
        if [ ! -f src/config.h ]; then
          echo "Using example config for CI build"
          cp src/config.h.example src/config.h
        fi
    
    - name: Build firmware with version
      run: |
        platformio run
      env:
        PLATFORMIO_BUILD_FLAGS: >
          -D VERSION_MAJOR=${{ steps.version.outputs.MAJOR }}
          -D VERSION_MINOR=${{ steps.version.outputs.MINOR }}
          -D VERSION_PATCH=${{ steps.version.outputs.PATCH }}
          -D GIT_COMMIT=\"${{ steps.version.outputs.GIT_COMMIT }}\"
    
    - name: Prepare release artifacts
      run: |
        mkdir -p dist
        cp .pio/build/esp32dev/firmware.bin dist/gamerbell-firmware-${{ steps.version.outputs.TAG }}.bin
        cp .pio/build/esp32dev/firmware.elf dist/gamerbell-firmware-${{ steps.version.outputs.TAG }}.elf
        
        # Create a version info file
        cat > dist/version.json << EOF
        {
          "version": "${{ steps.version.outputs.VERSION }}",
          "tag": "${{ steps.version.outputs.TAG }}",
          "commit": "${{ steps.version.outputs.GIT_COMMIT }}",
          "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "firmware_file": "gamerbell-firmware-${{ steps.version.outputs.TAG }}.bin"
        }
        EOF
        
        # Calculate checksums
        cd dist
        sha256sum *.bin *.elf > checksums.txt
        cd ..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/gamerbell-firmware-${{ steps.version.outputs.TAG }}.bin
          dist/gamerbell-firmware-${{ steps.version.outputs.TAG }}.elf
          dist/version.json
          dist/checksums.txt
        body: |
          ## GamerBell Firmware ${{ steps.version.outputs.TAG }}
          
          ### 📦 Release Information
          - **Version:** ${{ steps.version.outputs.VERSION }}
          - **Commit:** ${{ steps.version.outputs.GIT_COMMIT }}
          - **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          ### 📥 OTA Update
          Download `gamerbell-firmware-${{ steps.version.outputs.TAG }}.bin` for OTA updates.
          
          ### 🔐 Checksums
          See `checksums.txt` for SHA256 checksums of all files.
          
          ### 📝 Installation
          1. Download the `.bin` file
          2. Use OTA update via the device's web interface or upload via PlatformIO
          
          ---
          *This release was automatically generated by GitHub Actions.*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
